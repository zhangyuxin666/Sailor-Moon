<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>作业与待办 · 活动管家</title><link rel="stylesheet" href="/static/workspace.css"></head><body><div class="ws-shell"><aside class="ws-sidebar"><a class="ws-logo" href="/portal"><i>活</i><span><strong>活动管家</strong><small>ACTIVITY OS</small></span></a><nav class="ws-nav"><a data-nav="dashboard" href="/portal"><span>⌂</span>总览</a><a data-nav="agent" href="/agent" data-manager-only><span>✦</span>AI 助手</a><a data-nav="assignments" href="/assignments"><span>▤</span>作业与待办</a><a data-nav="activities" href="/activity"><span>◈</span>活动管理</a><a data-nav="members" href="/members" data-manager-only><span>◎</span>成员管理</a><a data-nav="settings" href="/settings"><span>⚙</span>设置</a></nav><div class="ws-user"><div id="shellAvatar" class="ws-avatar">A</div><span><strong id="shellUserName"></strong><small id="shellUserRole"></small></span></div></aside><main class="ws-main"><header class="ws-header"><div><p class="ws-kicker">ASSIGNMENTS</p><h1>作业与待办</h1><p>发布、提交、统计和提醒在一个清晰流程中完成。</p></div><div class="ws-actions" data-manager-only><button id="toggleCreate" class="ws-button">＋ 新建作业</button></div></header><section id="createPanel" class="ws-panel hidden" data-manager-only style="margin-bottom:13px"><div class="ws-panel-title"><div><h2>发布给全班</h2><p>简单收作业建议从 AI 助手描述需求，由 Agent 自动补全。</p></div><a class="ws-button light" href="/agent">交给 AI</a></div><form id="assignmentForm" class="ws-form"><div class="ws-form-row"><label>班级<select id="assignmentClass"></select></label><label>类型<select id="assignmentKind"><option value="homework">作业收集</option><option value="task">班级待办</option></select></label></div><label>标题<input id="assignmentTitle" required></label><label>要求<textarea id="assignmentDescription" rows="4"></textarea></label><label>截止时间<input id="assignmentDeadline" type="datetime-local" required></label><button class="ws-button">发布</button></form></section><section class="ws-panel"><div class="ws-panel-title"><div><h2 id="listTitle">全部作业</h2><p>点击项目查看每个人的完成情况</p></div><select id="assignmentFilter" class="ws-select"><option value="all">全部</option><option value="pending">未完成</option><option value="done">已完成</option></select></div><div id="assignmentList" class="ws-list"></div></section></main></div><dialog id="assignmentDialog" class="account-dialog" style="width:min(850px,92vw)"><button class="dialog-close" data-close>×</button><div id="assignmentDetail"></div></dialog><div id="wsToast" class="ws-toast"></div><script src="/static/workspace-common.js"></script><script src="/static/assignments-page.js"></script></body></html>
