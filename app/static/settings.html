<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>设置 · 活动管家</title><link rel="stylesheet" href="/static/workspace.css"></head><body><div class="ws-shell"><aside class="ws-sidebar"><a class="ws-logo" href="/portal"><i>活</i><span><strong>活动管家</strong><small>ACTIVITY OS</small></span></a><nav class="ws-nav"><a data-nav="dashboard" href="/portal"><span>⌂</span>总览</a><a data-nav="agent" href="/agent" data-manager-only><span>✦</span>AI 助手</a><a data-nav="assignments" href="/assignments"><span>▤</span>作业与待办</a><a data-nav="activities" href="/activity"><span>◈</span>活动管理</a><a data-nav="members" href="/members" data-manager-only><span>◎</span>成员管理</a><a data-nav="settings" href="/settings"><span>⚙</span>设置</a></nav><div class="ws-user"><div id="shellAvatar" class="ws-avatar">A</div><span><strong id="shellUserName"></strong><small id="shellUserRole"></small></span></div></aside><main class="ws-main"><header class="ws-header"><div><p class="ws-kicker">SETTINGS</p><h1>账号与连接</h1><p>管理登录安全、QQ 机器人和个人数据。</p></div></header><div class="ws-grid"><section class="ws-panel"><div class="ws-panel-title"><div><h2>账号信息</h2><p id="accountMeta"></p></div></div><form id="passwordForm" class="ws-form"><label>当前密码<input name="current_password" type="password" required></label><label>新密码<input name="new_password" type="password" minlength="8" required></label><button class="ws-button">修改密码</button></form></section><section class="ws-panel"><div class="ws-panel-title"><div><h2>QQ 机器人</h2><p>群绑定与消息网关状态</p></div><span id="qqDot" class="status-dot"></span></div><div id="qqStatus" class="reason-box">正在读取状态…</div></section><section class="ws-panel"><div class="ws-panel-title"><div><h2>隐私与数据</h2><p>查看政策并获取个人数据副本</p></div></div><div class="ws-actions"><a class="ws-button light" href="/privacy" target="_blank">隐私政策</a><a class="ws-button light" href="/account/export">导出我的数据</a></div></section><section class="ws-panel"><div class="ws-panel-title"><div><h2>登录会话</h2><p>在公共设备上使用后请退出</p></div></div><button id="logout" class="ws-button dark">退出当前账号</button></section></div><section class="ws-panel" style="margin-top:13px" data-manager-only><div class="ws-panel-title"><div><h2>操作审计</h2><p>最近 50 条关键管理操作</p></div><button id="refreshAudit" class="ws-button light">刷新</button></div><div id="auditRows" class="ws-list"></div></section></main></div><div id="wsToast" class="ws-toast"></div><script src="/static/workspace-common.js"></script><script src="/static/settings-page.js"></script></body></html>
