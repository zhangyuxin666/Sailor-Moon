<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 助手 · 活动管家</title><link rel="stylesheet" href="/static/workspace.css"></head><body><div class="ws-shell"><aside class="ws-sidebar"><a class="ws-logo" href="/portal"><i>活</i><span><strong>活动管家</strong><small>ACTIVITY OS</small></span></a><nav class="ws-nav"><a data-nav="dashboard" href="/portal"><span>⌂</span>总览</a><a data-nav="agent" href="/agent"><span>✦</span>AI 助手</a><a data-nav="assignments" href="/assignments"><span>▤</span>作业与待办</a><a data-nav="activities" href="/activity"><span>◈</span>活动管理</a><a data-nav="members" href="/members"><span>◎</span>成员管理</a><a data-nav="settings" href="/settings"><span>⚙</span>设置</a></nav><div class="ws-user"><div id="shellAvatar" class="ws-avatar">A</div><span><strong id="shellUserName">加载中</strong><small id="shellUserRole"></small></span></div></aside><main class="ws-main"><header class="ws-header"><div><p class="ws-kicker">INTENT WORKSPACE</p><h1>先理解，再执行</h1><p>Agent 会判断任务复杂度并给出最小合适流程，确认前不会发布。</p></div></header><section class="agent-hero"><h2>你现在想完成什么？</h2><p>不用考虑功能入口，直接描述目标、对象和时间。</p><form id="agentForm" class="agent-compose"><textarea id="agentInput" placeholder="例如：周五前收齐全班的数据库实验报告，PDF 格式，没交的当天晚上提醒"></textarea><div class="agent-compose-footer"><select id="agentClass" class="ws-select"></select><button class="ws-button" id="analyzeButton">分析需求 →</button></div></form><div class="example-chips"><button data-example="下周五前收齐全班的软件测试报告，提交 PDF，截止前一天提醒未交同学">收作业</button><button data-example="下月举办班级秋游，需要报名、分工、物料、日历和活动前提醒">组织活动</button><button data-example="统计大家下周空闲时间，并把问卷发到群里">收集信息</button><button data-example="通知大家明天下午三点到教学楼开班会">发通知</button></div></section><section id="draftArea" class="draft-layout hidden"><article class="ws-panel"><div class="ws-panel-title"><div><h2>Agent 方案草案</h2><p>修改内容与流程后再确认发布</p></div><div id="draftBadges" class="draft-badges"></div></div><form id="draftForm" class="ws-form"><div class="ws-form-row"><label>任务类型<select id="draftIntent"><option value="assignment">收作业</option><option value="activity">组织活动</option><option value="survey">收集信息</option><option value="notice">发布通知</option></select></label><label>复杂度<select id="draftComplexity"><option value="simple">简单</option><option value="standard">标准</option><option value="complex">复杂</option></select></label></div><label>标题<input id="draftTitle"></label><label>说明<textarea id="draftDescription" rows="5"></textarea></label><div class="ws-form-row"><label>截止时间<input id="draftDeadline" type="datetime-local"></label><label>活动时间<input id="draftEventTime" type="datetime-local"></label></div><div id="missingInfo" class="missing-list"></div><div id="reasoning" class="reason-box"></div><div class="publish-bar"><button type="button" id="saveDraft" class="ws-button light">保存修改</button><button type="button" id="publishDraft" class="ws-button">确认并发布</button></div></form></article><aside class="ws-panel"><div class="ws-panel-title"><div><h2>建议执行流程</h2><p>Agent 根据复杂度自动裁剪</p></div></div><div id="workflowList" class="workflow-list"></div></aside></section><section class="ws-panel" style="margin-top:13px"><div class="ws-panel-title"><div><h2>最近草案</h2><p>未确认草案可以继续修改</p></div></div><div id="draftHistory" class="ws-list"></div></section></main></div><div id="wsToast" class="ws-toast"></div><script src="/static/workspace-common.js"></script><script src="/static/agent-page.js"></script></body></html>
