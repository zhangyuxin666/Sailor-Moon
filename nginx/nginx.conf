# ============================================================
# Nginx 总配置：统一入口 + Tomcat 集群负载均衡
# ============================================================
worker_processes auto;

events {
    # 每个 Nginx 工作进程最多允许 1024 个并发连接。
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 自定义访问日志。$upstream_addr 会记录本次请求实际转到的 Tomcat。
    log_format upstream '$remote_addr "$request" status=$status '
                        'upstream=$upstream_addr upstream_status=$upstream_status '
                        'request_time=$request_time';

    access_log /dev/stdout upstream;
    error_log /dev/stderr warn;

    # ------------------------------------------------------------
    # 核心：Tomcat 集群节点列表
    # 没有 ip_hash / least_conn，因此使用 Nginx 默认的轮询策略。
    # ------------------------------------------------------------
    upstream activity_cluster {
        # app1、app2 是 Compose 中的服务名，Docker 会自动解析成容器 IP。
        # 连续失败 2 次后暂时摘除节点，10 秒后重新尝试。
        server app1:8080 max_fails=2 fail_timeout=10s;
        server app2:8080 max_fails=2 fail_timeout=10s;

        # 与上游 Tomcat 保持最多 32 个长连接。
        keepalive 32;
    }

    server {
        # 容器内部监听 80 端口；Compose 将它映射为宿主机的 18080。
        listen 80;
        server_name _;

        # 允许上传最大 25MB 的文件。
        client_max_body_size 25m;

        location / {
            # 使用 HTTP/1.1 和空 Connection 头，配合 upstream keepalive 复用连接。
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # 把原始访问者信息传给 Tomcat，便于后端识别 Host、IP 和协议。
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 连接后端、发送请求、等待响应的超时时间。
            proxy_connect_timeout 3s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # 故障转移：连接失败、超时或返回 5xx 时，切换到另一个 Tomcat。
            # 最多尝试 2 个上游节点。
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;

            # 响应头中暴露实际处理请求的上游地址，方便浏览器开发者工具检查。
            add_header X-Upstream-Addr $upstream_addr always;
            add_header X-Upstream-Status $upstream_status always;

            # 核心：把浏览器请求交给上面的 activity_cluster 集群。
            proxy_pass http://activity_cluster;
        }
    }
}
