name: checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      CHECK_RESULTS_DIR: ${{ runner.temp }}/sm-check-results
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            qq-gateway/package-lock.json
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12.15'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.lock
            ai_service/requirements.txt
            ai_service/requirements.lock
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Backup and restore safety contracts
        run: pwsh -NoProfile -File scripts/test-backup-contract.ps1
      - name: Unit, type, package, Compose and isolated PostgreSQL E2E checks
        run: ./scripts/check.ps1 -WithE2E -ResultsDirectory $env:CHECK_RESULTS_DIR
      - name: PostgreSQL physical replication and Java read routing
        run: python scripts/test_readwrite.py --output "$env:CHECK_RESULTS_DIR/readwrite.json"
      - name: Retain offline acceptance reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: offline-acceptance
          path: ${{ env.CHECK_RESULTS_DIR }}/*.json
          if-no-files-found: ignore
          retention-days: 7
