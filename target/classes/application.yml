server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_MB:20}MB
      max-request-size: ${UPLOAD_MAX_MB:20}MB

spring:
  application:
    name: activity-assistant-business
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:55432/activity}
    username: ${SPRING_DATASOURCE_USERNAME:activity}
    password: ${SPRING_DATASOURCE_PASSWORD:activity}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 1
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
  jackson:
    property-naming-strategy: SNAKE_CASE
  mvc:
    problemdetails:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  public-base-url: ${PUBLIC_BASE_URL:http://127.0.0.1:8080}
  cookie-secure: ${COOKIE_SECURE:false}
  session-days: ${SESSION_DAYS:7}
  upload-max-mb: ${UPLOAD_MAX_MB:20}
  user-storage-quota-mb: ${USER_STORAGE_QUOTA_MB:200}
  storage-local-path: ${STORAGE_LOCAL_PATH:data/uploads}
  timezone: ${TIMEZONE:Asia/Shanghai}
  ai-base-url: ${AI_SERVICE_URL:http://127.0.0.1:8000}
  ai-internal-token: ${AI_INTERNAL_TOKEN:change-this-local-ai-token}
  qq-gateway-base-url: ${QQ_GATEWAY_URL:http://127.0.0.1:3000}
  qq-gateway-token: ${QQ_GATEWAY_TOKEN:change-this-local-token}
  qq-bot-app-id: ${QQ_BOT_APP_ID:}
  qq-bot-app-secret: ${QQ_BOT_APP_SECRET:}
  http-timeout: ${INTERNAL_HTTP_TIMEOUT:35s}
